[package]
name = "kuntur-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kuntur"
path = "src/main.rs"

[dependencies]
kuntur-term = { path = "../kuntur-term" }
kuntur-config = { path = "../kuntur-config" }
kuntur-agents = { path = "../kuntur-agents" }
kuntur-hook = { path = "../kuntur-hook" }
kuntur-usage = { path = "../kuntur-usage" }
kuntur-files = { path = "../kuntur-files" }
kuntur-ssh = { path = "../kuntur-ssh" }
gpui-kit = { workspace = true }
smol = { workspace = true }
sysinfo = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
kuntur-audit = { path = "../kuntur-audit" }

[target.'cfg(windows)'.dependencies]
# Notificaciones de Windows (alertas, F5).
tauri-winrt-notification = "0.8.1"
