[package]
name = "kuntur-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kuntur-term = { path = "../kuntur-term" }
kuntur-files = { path = "../kuntur-files" }
anyhow = { workspace = true }
# `ring` en vez de `aws-lc-rs` (el predeterminado): compila en Windows sin CMake ni NASM.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# SFTP (F7): no depende de `russh`; va sobre `channel.into_stream()`. Sus pruebas usan russh 0.65.
russh-sftp = "4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros", "io-util"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
# Sin `search` (evita `regex`, ~1 MB).
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
