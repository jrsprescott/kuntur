<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Ejemplo</title>
<style>
body{font-family:Segoe UI,sans-serif;background:#fafafa;color:#222;margin:24px}
h1{color:#1565c0}.caja{border:2px solid #1565c0;border-radius:8px;padding:12px;margin-top:12px}
</style></head>
<body>
<h1>Página de ejemplo (sintética)</h1>
<p>Si ves esto dentro de la ventana GPUI, el WebView2 hijo funciona.</p>
<div class="caja">Tamaño del visor: <b id="w"></b> px</div>
<script>
function m(){document.getElementById('w').textContent=window.innerWidth+' × '+window.innerHeight}
window.addEventListener('resize',m);m();
</script>
</body></html>
