# Precios de API para el COSTO ESTIMADO de "Uso de agentes" (USD por millón de tokens).
#
# - Es el precio de API: si usas una suscripción (Claude Pro/Max, ChatGPT Plus…), lo que pagas es
#   otra cosa; esto indica cuánto costaría ese uso por API.
# - Para cambiar o agregar precios, copia este archivo a %APPDATA%\Kuntur\pricing.toml (la paleta
#   tiene "Uso de agentes: editar precios") y edítalo: tus entradas reemplazan a estas.
# - `modelo` se compara sin mayúsculas, con el nombre exacto o con una fecha al final
#   ("claude-haiku-4-5" vale para "claude-haiku-4-5-20251001"). Un prefijo "proveedor/" del nombre
#   (OpenCode) se ignora.
# - Los modelos que no estén aquí aparecen como "sin precio" y no suman (no se inventan precios).
# - cache_lectura = entrada en caché (acierto); cache_escritura = escritura de caché de 5 min.

