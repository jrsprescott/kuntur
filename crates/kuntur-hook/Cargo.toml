[package]
name = "kuntur-hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Biblioteca (protocolo, named pipe, instalador de ganchos) + binario `kuntur-hook.exe`, que invocan
# los hooks y la línea de estado de Claude Code.
[lib]
path = "src/lib.rs"

[[bin]]
name = "kuntur-hook"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
# `preserve_order`: el instalador reescribe settings.json sin desordenar las claves del usuario.
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
