name: CI

on:
  push:
    branches: [main, "fase/**", "integracion/**", "ajustes/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy (todos los crates y destinos)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas (incluye ConPTY real)
        run: cargo test --workspace

  # Instalador MSI: solo en las etiquetas v* (p. ej. v0.1.0), después de que pasen las pruebas.
  # Queda como artefacto del flujo; la release la publica el usuario a mano.
  msi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    env:
      # Vacío si el repositorio no tiene el secreto: los pasos de SignPath se saltan.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WiX Toolset v3.14.1 (binarios oficiales)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'wix'
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw "SHA-256 inesperado: $hash" }
          Expand-Archive $zip -DestinationPath (Join-Path $dir 'bin')
          "WIX=$dir\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Generar el MSI
        shell: pwsh
        run: ./scripts/msi.ps1 -Check
      - uses: actions/upload-artifact@v4
        id: msi-artifact
        with:
          name: kuntur-msi
          path: target/wix/*.msi
          if-no-files-found: error
      # Firma con SignPath (docs/FIRMA.md): solo si el repositorio tiene los secretos de SignPath.
      # Sin ellos los dos pasos se saltan y el MSI queda sin firmar (como hasta ahora).
      - name: Firmar con SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kuntur
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.msi-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/firmado
      - name: Subir el MSI firmado
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: kuntur-msi-firmado
          path: target/firmado/*.msi
          if-no-files-found: error

  # Linux y Mac (ajustes v0.2, §10): Kuntur todavía se publica solo para Windows; estos trabajos
  # comprueban que todo compile y que pasen las pruebas de los crates sin interfaz. No frenan la CI
  # (continue-on-error) hasta que haya instaladores para esos sistemas.
  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema (GPUI y WebKitGTK de wry)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev \
            libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Compilar todo (check)
        run: cargo check --workspace --all-targets
      - name: Pruebas de los crates sin interfaz
        run: cargo test -p kuntur-config -p kuntur-files -p kuntur-complete -p kuntur-update -p kuntur-usage -p kuntur-audit -p kuntur-agents -p kuntur-preview

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar todo (check)
        run: cargo check --workspace --all-targets
      - name: Pruebas de los crates sin interfaz
        run: cargo test -p kuntur-config -p kuntur-files -p kuntur-complete -p kuntur-update -p kuntur-usage -p kuntur-audit -p kuntur-agents -p kuntur-preview
