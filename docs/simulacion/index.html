<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuntur — Simulación v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&family=Fira+Code:wght@400;600&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ui:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',Consolas,monospace;--fs:13px}

/* ───────── Paletas ───────── */
[data-theme=blue]{
  --backdrop:#0a1433; --win:linear-gradient(140deg,#1a379a 0%,#2156d4 48%,#3b82f6 100%);
  --title:rgba(9,20,66,.55); --surface:rgba(8,20,68,.40); --surface-2:rgba(255,255,255,.075);
  --hover:rgba(255,255,255,.11); --border:rgba(255,255,255,.15); --pop:#13308a;
  --text:#eaf2ff; --muted:#a9c1ee; --faint:#7d99cf;
  --accent:#22d3ee; --accent-2:#93c5fd; --accent-ink:#03263a;
  --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --term:rgba(5,14,52,.40); --dock:rgba(3,10,40,.55);
  --kw:#f0abfc; --fn:#67e8f9; --str:#86efac; --com:#8fa8db; --num:#fdba74; --typ:#fde68a; --var:#eaf2ff; --op:#a5b4fc;
  --add:rgba(74,222,128,.14); --del:rgba(248,113,113,.14);
}
[data-theme=dark]{
  --backdrop:#05070c; --win:linear-gradient(160deg,#0d121d 0%,#0a0e16 100%);
  --title:#0c111b; --surface:#0f1522; --surface-2:#151d2e;
  --hover:#1b2538; --border:#232d42; --pop:#121a29;
  --text:#d5dcea; --muted:#8290a8; --faint:#5b677e;
  --accent:#7aa2f7; --accent-2:#bb9af7; --accent-ink:#0b1020;
  --ok:#9ece6a; --warn:#e0af68; --err:#f7768e; --term:#0b1019; --dock:#080c14;
  --kw:#bb9af7; --fn:#7aa2f7; --str:#9ece6a; --com:#5f6a8f; --num:#ff9e64; --typ:#2ac3de; --var:#c0caf5; --op:#89ddff;
  --add:rgba(158,206,106,.12); --del:rgba(247,118,142,.12);
}
[data-theme=white]{
  --backdrop:#d9e0ec; --win:linear-gradient(160deg,#f6f8fc 0%,#eef2f8 100%);
  --title:#ffffff; --surface:#ffffff; --surface-2:#f3f6fa;
  --hover:#e9eef6; --border:#dbe2ec; --pop:#ffffff;
  --text:#1c2333; --muted:#5f6b84; --faint:#98a2b6;
  --accent:#2563eb; --accent-2:#7c3aed; --accent-ink:#ffffff;
  --ok:#15803d; --warn:#b45309; --err:#dc2626; --term:#fbfcfe; --dock:#f3f6fa;
  --kw:#7c3aed; --fn:#2563eb; --str:#15803d; --com:#8a94a8; --num:#c2410c; --typ:#0e7490; --var:#1c2333; --op:#475569;
  --add:rgba(21,128,61,.09); --del:rgba(220,38,38,.08);
}

html,body{height:100%}
body{background:var(--backdrop);font-family:var(--ui);color:var(--text);padding:14px;font-size:13px;overflow:hidden;transition:background .3s}
button{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--accent) 38%,transparent)}
.win{height:100%;border-radius:14px;background:var(--win);display:grid;grid-template-rows:44px minmax(0,1fr) 26px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45);border:1px solid var(--border)}

/* ───────── Barra de título ───────── */
.titlebar{display:flex;align-items:center;gap:10px;padding:0 14px 0 10px;background:var(--title);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}
.brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--accent-ink);font-family:var(--mono);font-size:12px;font-weight:700}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.tb-search{margin-left:14px;flex:1;max-width:420px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden}
.kbd{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--border);background:var(--hover);color:var(--text);white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.themes{display:flex;gap:6px;align-items:center}
.theme-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
.theme-dot.on{outline:2px solid var(--accent);outline-offset:2px}
.theme-dot[data-t=blue]{background:linear-gradient(135deg,#1a379a,#3b82f6)}
.theme-dot[data-t=dark]{background:linear-gradient(135deg,#0a0e16,#232d42)}
.theme-dot[data-t=white]{background:linear-gradient(135deg,#fff,#dbe2ec)}
.wbtns{display:flex;gap:8px;padding-left:12px;border-left:1px solid var(--border)}
.wbtn{width:13px;height:13px;border-radius:50%;border:0;cursor:pointer;position:relative}
.wbtn.min{background:#febc2e}.wbtn.max{background:#28c840}.wbtn.close{background:#ff5f57}
.wbtn:hover::after{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;color:rgba(0,0,0,.6)}
.wbtn.min:hover::after{content:'–'}.wbtn.max:hover::after{content:'+'}.wbtn.close:hover::after{content:'×'}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ───────── Cuerpo ───────── */
.body{display:grid;grid-template-columns:var(--sideW,250px) minmax(0,1fr) 340px;min-height:0;transition:grid-template-columns .2s}
body[data-side=icons] .body{--sideW:60px}
body[data-side=hidden] .body{--sideW:0px}
body[data-side=hidden] .side{display:none}

/* Pestañas (izquierda) */
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 10px 8px 14px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.side-h .grp{display:flex;gap:4px;position:relative}
body[data-side=icons] .side-h{flex-direction:column;padding:10px 6px 6px}
body[data-side=icons] .side-h .lbl{display:none}
.btn-icon{min-width:26px;height:26px;padding:0 6px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1}
.btn-icon:hover{background:var(--hover);border-color:var(--accent)}
.btn-icon.ghost{background:none;border-color:transparent}
.btn-icon.ghost:hover{background:var(--hover)}
.menu{position:absolute;top:30px;left:0;z-index:30;min-width:220px;background:var(--pop);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:8px;align-items:center;padding:7px 9px;border:0;background:none;border-radius:7px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu .m-sub{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:10.5px}
.tabs{flex:1;overflow:auto;padding:2px 8px 8px;display:flex;flex-direction:column;gap:3px}
.tab{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px 8px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.tab:hover{background:var(--hover)}
.tab.active{background:var(--surface-2);border-color:var(--border);box-shadow:inset 3px 0 0 var(--accent)}
.tile{position:relative;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tile svg.i{width:18px;height:18px}
.tile .dot{position:absolute;right:-3px;bottom:-3px;border:2px solid var(--pop)}
.tile .badge{position:absolute;top:-7px;right:-9px;font-size:10px;font-weight:700;background:var(--warn);color:#2a1800;border-radius:99px;padding:0 5px;line-height:16px}
.tab .name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .name input{width:100%;font:inherit;background:var(--hover);color:var(--text);border:1px solid var(--accent);border-radius:5px;padding:1px 4px;outline:0}
.tab .sum{font-size:11.5px;color:var(--text);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tab .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tab .x{opacity:0;width:22px;height:22px;border-radius:6px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px}
.tab:hover .x,.tab.active .x{opacity:1}
.tab .x:hover{background:var(--hover);color:var(--err)}
.tab .sum-i{display:none}
body[data-side=icons] .tabs{padding:4px 0 8px;gap:8px;align-items:center}
body[data-side=icons] .tab{grid-template-columns:1fr;justify-items:center;padding:3px;border:0;border-radius:12px;background:none;box-shadow:none}
body[data-side=icons] .tab:hover,body[data-side=icons] .tab.active{background:none;box-shadow:none}
body[data-side=icons] .tab::before{content:'';position:absolute;left:-9px;top:50%;width:3px;height:0;border-radius:0 3px 3px 0;background:var(--accent);transform:translateY(-50%);transition:height .15s}
body[data-side=icons] .tab:hover::before{height:14px}
body[data-side=icons] .tab.active::before{height:26px}
body[data-side=icons] .tab .info,body[data-side=icons] .tab .x{display:none}
body[data-side=icons] .tile{width:36px;height:36px;border-radius:11px;opacity:.72;transition:opacity .15s}
body[data-side=icons] .tile svg.i{width:18px;height:18px}
body[data-side=icons] .tab:hover .tile,body[data-side=icons] .tab.active .tile{opacity:1}
body[data-side=icons] .tab.active .tile{box-shadow:0 0 0 2px var(--accent)}
.hcard{position:fixed;z-index:65;width:270px;background:var(--pop);border:1px solid var(--border);border-radius:12px;padding:11px 13px;box-shadow:0 16px 44px rgba(0,0,0,.45);pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .12s;font-size:12px}
.hcard.open{opacity:1;transform:none}
.hcard .h{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.hcard .h .k{margin-left:auto;font-weight:500}
.hcard .s{margin-top:6px;line-height:1.45}
.hcard .p{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all}
.hcard .a{margin-top:7px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;font-family:var(--mono)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.dot.working{background:var(--accent);animation:pulse 1.6s infinite}
.dot.waiting{background:var(--warn);animation:blink 1s infinite}
.dot.done{background:var(--ok)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
@keyframes blink{50%{opacity:.35}}
.side-f{border-top:1px solid var(--border);padding:10px 12px;font-size:11px;color:var(--muted);display:grid;gap:4px}
.side-f b{color:var(--text);font-family:var(--mono);font-weight:600}
body[data-side=icons] .side-f{display:none}

.logo{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff;flex:none;font-family:var(--mono)}
.logo.sm{width:16px;height:16px;font-size:9px;border-radius:4px}
.logo.claude{background:#c96442}.logo.codex{background:#0f8a6a}

/* Centro: sesión + terminal acoplada */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--term)}
.main-h{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);flex-wrap:wrap}
.main-h .t{font-weight:700;color:var(--text);font-size:13px;margin-right:4px}
.chip{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);white-space:nowrap}
.chip.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.main-h .sp{flex:1}
.btn{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--accent)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{padding:3px 8px;font-size:11px;border-radius:7px}
.session{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.blocks{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:var(--fs);line-height:1.55}
.block{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);overflow:hidden;flex:none}
.block.err{box-shadow:inset 3px 0 0 var(--err)}
.block-h{display:flex;gap:8px;align-items:center;padding:5px 10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-family:var(--ui);user-select:none}
.block-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.bt{border:1px solid transparent;background:none;border-radius:6px;padding:1px 7px;cursor:pointer;font-size:11px;color:var(--muted);opacity:0;transition:opacity .15s}
.block:hover .bt{opacity:1}
.bt:hover{border-color:var(--border);color:var(--text);background:var(--hover)}
.block .cmd{padding:8px 12px 2px;color:var(--text);font-weight:600}
.block .out{padding:4px 12px 10px;white-space:pre-wrap;word-break:break-word;color:var(--text);opacity:.92}
.dim{color:var(--muted)}.ok{color:var(--ok)}.warn{color:var(--warn)}.errc{color:var(--err)}.acc{color:var(--accent)}
.ag-prompt{color:var(--accent);font-weight:600;margin:2px 0 6px}
.ag-tool b{color:var(--fn)}
.ag-tool .add-n{color:var(--ok)}.ag-tool .del-n{color:var(--err)}
.diff,.log{margin:6px 0 8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;white-space:pre;overflow-x:auto}
.diff div{padding:0 10px}
.diff .add{background:var(--add)}.diff .del{background:var(--del)}
.diff .ln{display:inline-block;width:2.2em;color:var(--faint);user-select:none}
.log{padding:6px 10px;white-space:pre-wrap;color:var(--err);font-size:.95em}
.ag-note{margin:6px 0 4px;white-space:normal}
.sug{display:flex;gap:8px;align-items:center;margin:4px 0;padding:6px 8px;border-radius:8px;background:var(--term);border:1px solid var(--border);white-space:normal;flex-wrap:wrap}
.sug code{flex:1;font-family:var(--mono);min-width:200px}
.sug button,.ag-ask button,.ag-done button{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 9px;cursor:pointer;font-family:var(--ui);font-size:11.5px;font-weight:600;user-select:none}
.sug button.prim{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ag-live{color:var(--warn)}
.spin{display:inline-block;animation:spin 1.2s linear infinite;color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.ag-ask{margin-top:6px;padding:8px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent);white-space:normal}
.ag-ask button.yes{background:var(--ok);color:#06200f;border-color:transparent}
.ag-done{color:var(--ok);margin-top:4px}
.ag-subs{color:var(--muted);margin-top:2px}

/* sintaxis */
.kw{color:var(--kw)}.fn{color:var(--fn)}.str{color:var(--str)}.com{color:var(--com);font-style:italic}.num{color:var(--num)}.typ{color:var(--typ)}.var{color:var(--var)}.op{color:var(--op)}
.c-cmd{color:var(--fn);font-weight:600}.c-unknown{color:var(--err);text-decoration:underline wavy}.c-flag{color:var(--typ)}.c-str{color:var(--str)}
.c-path{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px}
.c-path-bad{color:var(--warn)}.c-num{color:var(--num)}.c-arg{color:var(--var)}

/* editor de entrada (multilínea) + autocompletado */
.input-wrap{position:relative;margin:0 14px 10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:8px 12px 7px}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.prompt-line{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:4px;font-family:var(--mono);flex-wrap:wrap}
.editor{position:relative;font-family:var(--mono);font-size:calc(var(--fs) + 1px);height:24px}
.editor .hl,.editor textarea{position:absolute;inset:0;white-space:pre;font:inherit;line-height:24px;padding:0;letter-spacing:0;font-variant-ligatures:none;overflow:hidden}
.editor .hl{pointer-events:none}
.editor textarea{background:transparent;border:0;outline:0;color:transparent;caret-color:var(--accent);width:100%;resize:none}
.editor textarea::selection{color:transparent}
.hl .ghost{color:var(--faint)}
.hint{display:flex;gap:12px;font-size:10.5px;color:var(--faint);margin-top:4px;font-family:var(--ui);flex-wrap:wrap}
.hint .paste{color:var(--warn);font-weight:600}
.suggest{position:absolute;left:8px;bottom:calc(100% + 6px);width:min(640px,calc(100% - 16px));background:var(--pop);border:1px solid var(--border);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.35);padding:5px;display:none;z-index:20;font-family:var(--mono);font-size:12.5px}
.suggest.open{display:block}
.sg{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;padding:5px 8px;border-radius:7px;cursor:pointer;align-items:center}
.sg.sel,.sg:hover{background:var(--hover)}
.sg .k{font-family:var(--ui);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:5px;text-align:center}
.k.carpeta{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.k.archivo{color:var(--muted);background:var(--hover)}
.k.visitada{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.k.historial{color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 14%,transparent)}
.k.comando{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.k.unidad{color:var(--typ);background:var(--hover)}
.sg .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .d{color:var(--muted);font-size:11px;font-family:var(--ui)}
.sg-f{border-top:1px solid var(--border);margin-top:4px;padding:5px 8px 2px;color:var(--faint);font-size:10.5px;font-family:var(--ui)}

/* terminal acoplada */
.dock{display:none;flex-direction:column;height:var(--dockH,250px);min-height:110px;border-top:2px solid var(--border);background:var(--dock);position:relative}
.dock.open{display:flex}
.dock-resize{position:absolute;top:-5px;left:0;right:0;height:9px;cursor:ns-resize;z-index:5}
.dock-resize:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.dock-h{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);background:var(--surface);flex-wrap:wrap}
.dock-h b{color:var(--text)}
.dock-h .sp{flex:1}
.dock-h select{font:inherit;font-size:11.5px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 6px;max-width:260px}
.dock-out{flex:1;overflow:auto;padding:8px 14px 4px;font-family:var(--mono);font-size:var(--fs);white-space:pre-wrap;word-break:break-word;line-height:1.5}
.dock-in{display:flex;gap:8px;align-items:center;padding:4px 14px 8px;font-family:var(--mono);font-size:var(--fs)}
.dock-in input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;min-width:0}
.pr{color:var(--ok);white-space:nowrap}.pr .h{color:var(--accent)}

/* Panel derecho */
.right{background:var(--surface);border-left:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0;overflow:hidden}
.panel{display:flex;flex-direction:column;min-height:0}
.panel+.panel{border-top:1px solid var(--border)}
.panel-h{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel-h .cnt{font-family:var(--mono);letter-spacing:0;background:var(--hover);color:var(--text);padding:0 6px;border-radius:99px}
.panel-h .r{margin-left:auto;display:flex;gap:4px;text-transform:none;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:2px 7px;font-size:10.5px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--hover);color:var(--text)}
.counters{display:flex;gap:10px;padding:0 12px 6px;font-size:11px;font-family:var(--mono)}
.panel-b{overflow:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px}
.alist{overflow:auto;padding:0 6px 6px;flex:1;min-height:0}
.ar{display:grid;grid-template-columns:12px 16px 84px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 6px;border-radius:6px;cursor:pointer;min-height:25px;border-left:2px solid transparent;font-size:12px}
.ar:hover{background:var(--hover)}
.ar.sel{background:var(--surface-2);border-left-color:var(--accent)}
.ar.waiting{background:color-mix(in srgb,var(--warn) 11%,transparent)}
.ar .tw{color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center;user-select:none}
.ar .an{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar.s .an{font-weight:500;color:var(--muted);font-size:11.5px}
.ar .aa{font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.ar .aa b{color:var(--fn);font-weight:600}
.ar.done .aa{color:var(--muted)}
.ar .at{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;display:flex;gap:5px;align-items:center}
.ar .at button{border:0;background:var(--ok);color:#06200f;border-radius:5px;padding:0 6px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:var(--ui)}
.sdot{width:8px;height:8px;border-radius:50%;justify-self:center;background:var(--faint)}
.sdot.working{background:var(--accent);animation:pulse 1.6s infinite}
.sdot.waiting{background:var(--warn);animation:blink 1s infinite}
.sdot.done{background:var(--ok)}
.grp-h{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:8px 6px 3px}
.ag-detail{border-top:1px solid var(--border);padding:8px 12px 10px;font-size:11.5px;display:grid;gap:3px;background:var(--surface-2)}
.ag-detail .m{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-detail .btns{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.mini{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:11px;font-weight:600}
.mini:hover{border-color:var(--accent)}
.mini.danger:hover{border-color:var(--err);color:var(--err)}
.empty{border:1px dashed var(--border);border-radius:10px;padding:14px;color:var(--muted);text-align:center;font-size:12px;line-height:1.6;margin:4px 6px}

.u-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.u-head .nm{font-weight:700}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.metric{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px 9px;min-width:0}
.metric .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.metric .v{font-family:var(--mono);font-size:15px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v small{font-size:11px;color:var(--muted);font-weight:400}
.metric.wide{grid-column:1/-1}
.spark{width:100%;height:38px;display:block;margin-top:4px}
.bar{height:7px;border-radius:99px;background:var(--hover);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.bar>i.w{background:var(--warn)}.bar>i.e{background:var(--err)}
.sec-t{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.limit{display:grid;grid-template-columns:minmax(0,1fr) auto;font-size:11.5px;gap:0 8px}
.limit .rs{color:var(--muted);font-size:10.5px;text-align:right}
.limit .bar{grid-column:1/-1}
.foot{font-size:10px;color:var(--faint);line-height:1.5}

.status{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--title);border-top:1px solid var(--border);font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden}
.status .sp{flex:1}
.status b{color:var(--text);font-weight:600}

/* hoja Ctrl+K */
.overlay{position:fixed;inset:0;background:rgba(2,6,20,.45);display:none;place-items:center;z-index:50;backdrop-filter:blur(3px)}
.overlay.open{display:grid}
.sheet{width:min(880px,94vw);max-height:86vh;background:var(--pop);border:1px solid var(--border);border-radius:14px;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.sheet-h h2{font-size:15px;font-family:'Space Grotesk',var(--ui)}
.sheet-h .x{margin-left:auto}
.sheet-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.sheet-tab{padding:9px 12px;cursor:pointer;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;font-weight:600;font-size:12.5px;white-space:nowrap}
.sheet-tab.on{color:var(--text);border-bottom-color:var(--accent)}
.sheet-b{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:12px}
.mcp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mcp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface-2)}
.mcp .n{font-weight:700;font-family:var(--mono);font-size:12px}
.mcp .d{font-size:11px;color:var(--muted);grid-column:1}
.mcp .sw{grid-row:1/3;grid-column:2}
.sw{width:36px;height:20px;border-radius:99px;background:var(--hover);position:relative;cursor:pointer;border:1px solid var(--border);flex:none;display:inline-block}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:var(--accent);border-color:transparent}
.sw.on::after{left:18px;background:var(--accent-ink)}
pre.code{font-family:var(--mono);font-size:12px;background:var(--term);border:1px solid var(--border);border-radius:9px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;line-height:1.55}
label.f{display:grid;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.inp,select.inp{font:inherit;font-size:12.5px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 9px;outline:0;min-width:0}
.inp:focus{border-color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:6px 8px;border-bottom:1px solid var(--border)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
table.t td.m{font-family:var(--mono);font-size:11.5px}
.scope{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px}
.scope.tab{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.scope.global{background:var(--hover);color:var(--muted)}
.theme-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{border:2px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:none;text-align:left;padding:0}
.tcard.on{border-color:var(--accent)}
.tcard .pv{height:84px;padding:10px;font-family:var(--mono);font-size:11px;line-height:1.5}
.tcard .lb{padding:7px 10px;font-weight:700;font-size:12px;border-top:1px solid var(--border);background:var(--surface-2)}
.tcard .lb small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.ansi{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.ansi i{height:26px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:end start;padding:2px 4px;font-style:normal;font-size:9px;font-family:var(--mono);color:#fff;text-shadow:0 0 3px #000}
.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.samples pre.code{white-space:pre;overflow-x:auto;word-break:normal;font-size:11.5px}
.samples .cap{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.note{font-size:12px;line-height:1.6;color:var(--muted);border-left:3px solid var(--accent);padding:4px 0 4px 10px}
.note b{color:var(--text)}

/* pestañas del panel derecho: Agentes | Archivos */
.ptabs{display:flex;align-items:center;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--border)}
.ptabs>button{border:0;background:none;padding:7px 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.ptabs>button.on{color:var(--text);border-bottom-color:var(--accent)}
.ptabs .cnt{font-family:var(--mono);letter-spacing:0;background:var(--hover);color:var(--text);padding:0 6px;border-radius:99px}
.ptabs .r{margin-left:auto;display:flex;gap:4px;padding-bottom:3px}
.pview{display:none;flex-direction:column;min-height:0;flex:1}
.pview.on{display:flex}
.counters{padding-top:7px}

/* explorador de archivos (local Windows + remoto Linux) */
.fpane{display:flex;flex-direction:column;min-height:0;flex:1}
.fpane+.fpane{border-top:1px solid var(--border)}
.fbar{display:flex;align-items:center;gap:2px;padding:6px 8px 2px 12px}
.fbar .os{font-size:10.5px;font-weight:700;color:var(--text);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.fbar .os svg.i{width:14px;height:14px;color:var(--muted)}
.fbar .sp{flex:1}
.fbtn{border:0;background:none;border-radius:6px;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.fbtn svg.i{width:14px;height:14px}
.fbtn:hover{background:var(--hover);color:var(--text)}
.fbtn.on{color:var(--accent)}
.crumbs{display:flex;overflow:hidden;padding:0 10px 4px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.crumbs span{cursor:pointer;padding:0 1px;border-radius:4px}
.crumbs span:hover{background:var(--hover);color:var(--text)}
.crumbs span:last-child{color:var(--text)}
.flist{flex:1;overflow:auto;padding:0 6px 6px;outline:0;min-height:70px;border-radius:8px}
.flist:focus-visible{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 50%,transparent)}
.fr{display:grid;grid-template-columns:16px minmax(0,1fr) 54px 42px;gap:7px;align-items:center;padding:2px 6px;border-radius:6px;font-size:12px;cursor:default;user-select:none;min-height:23px}
.fr:hover{background:var(--hover)}
.fr.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.fr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .z,.fr .d{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}
.fr svg.i{width:15px;height:15px}
.ic{display:grid;place-items:center;color:var(--muted)}
.ic.dir{color:var(--accent)}.ic.code{color:var(--fn)}.ic.img{color:var(--kw)}.ic.arc{color:var(--warn)}.ic.cfg{color:var(--typ)}
.fr.new{animation:flash 1.4s}
@keyframes flash{0%{background:color-mix(in srgb,var(--ok) 40%,transparent)}100%{background:transparent}}
.flist.drop,.session.drop{outline:2px dashed var(--accent);outline-offset:-4px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.fhint{font-size:10.5px;color:var(--faint);padding:5px 12px 6px;text-align:center;line-height:1.4}
.xfers{border-top:1px solid var(--border);padding:6px 12px 8px;display:grid;gap:5px;font-size:11px}
.xf{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px;align-items:center}
.xf .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xf .m{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.xf .pb{grid-column:2/-1;height:2px;background:var(--hover);border-radius:2px;overflow:hidden}
.xf .pb i{display:block;height:100%;background:var(--accent)}
.xf.done .pb i{background:var(--ok)}
.dropmsg{position:absolute;inset:10px;display:none;place-items:center;border-radius:10px;font-weight:700;color:var(--accent);pointer-events:none;z-index:6;text-align:center;line-height:1.6}
.session.drop .dropmsg{display:grid}

/* uso minimalista */
.usage-panel .panel-b{padding:2px 12px 10px}
.um{display:grid;gap:6px;font-size:11.5px}
.um-top{display:flex;align-items:center;gap:6px}
.um-top b{font-size:12px}
.um-top .r{margin-left:auto;font-family:var(--mono);font-weight:600}
.um-row{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.um-row b{color:var(--text);font-weight:600;font-size:11.5px}
.um-row .r{margin-left:auto}
canvas.spk{width:70px;height:16px;display:block}
.lim{display:grid;grid-template-columns:66px minmax(0,1fr) 30px 46px;gap:8px;align-items:center;font-size:10.5px}
.lim .l{color:var(--muted);white-space:nowrap}
.lim .p{font-family:var(--mono);text-align:right}
.lim .t{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:right;white-space:nowrap}
.thin{height:3px;border-radius:3px;background:var(--hover);overflow:hidden}
.thin i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s}
.thin i.w{background:var(--warn)}.thin i.e{background:var(--err)}
.um hr{border:0;border-top:1px solid var(--border);margin:2px 0}

/* menú contextual y avisos */
.ctx{position:fixed;z-index:70;min-width:250px;background:var(--pop);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:0 16px 44px rgba(0,0,0,.45);display:none;font-size:12.5px}
.ctx.open{display:block}
.ctx button{display:flex;width:100%;gap:8px;align-items:center;padding:6px 9px;border:0;background:none;border-radius:7px;cursor:pointer;text-align:left}
.ctx button:hover:not(:disabled){background:var(--hover)}
.ctx button:disabled{opacity:.4;cursor:default}
.ctx button .k{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ctx hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
.toasts{position:fixed;right:24px;bottom:44px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--pop);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;min-width:280px;max-width:380px;box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:12.5px;display:flex;gap:10px;align-items:center;animation:in .25s ease-out}
.toast.info{border-left-color:var(--accent)}
.toast .sp{flex:1}
@keyframes in{from{transform:translateY(10px);opacity:0}}

/* ═════════ v4 · capa minimalista ═════════ */
[data-theme=blue]{--line:rgba(255,255,255,.09);--border:rgba(255,255,255,.10);--surface:rgba(6,16,58,.26);--surface-2:rgba(255,255,255,.05);--term:rgba(4,12,46,.20);--title:transparent}
[data-theme=dark]{--line:#1b2334;--border:#1f293b;--surface:#0b1019;--surface-2:#111827;--term:#0b1019;--title:#0b1019;--win:#0b1019}
[data-theme=white]{--line:#e7ebf1;--border:#e3e8ef;--surface:#fbfcfd;--surface-2:#f4f6f9;--term:#ffffff;--title:#fbfcfd;--win:#ffffff}
.win{grid-template-rows:40px minmax(0,1fr);border-radius:12px}
.status,.main-h,.prompt-line{display:none}
.titlebar{position:relative;gap:2px;padding:0 12px 0 6px;background:var(--title);border-bottom:1px solid var(--line)}
.ib{width:30px;height:30px;border:0;background:none;border-radius:8px;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib.on{color:var(--accent)}
.ib svg.i{width:16px;height:16px;stroke-width:1.8}
.tb-title{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--muted);cursor:pointer;padding:5px 12px;border-radius:8px;max-width:52%;white-space:nowrap;overflow:hidden}
.tb-title:hover{background:var(--hover)}
.tb-title b{color:var(--text);font-weight:600}
.tb-title .mono{font-family:var(--mono);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.tb-right{gap:2px}
.wbtns{border-left:0;padding-left:12px;gap:8px}
.wbtn{width:12px;height:12px;background:var(--faint)!important;opacity:.45;transition:opacity .15s,background .15s}
.titlebar:hover .wbtn{opacity:1}
.titlebar:hover .wbtn.min{background:#febc2e!important}.titlebar:hover .wbtn.max{background:#28c840!important}.titlebar:hover .wbtn.close{background:#ff5f57!important}
.body{grid-template-columns:var(--sideW,232px) minmax(0,1fr) 316px}
body[data-right=off] .body{grid-template-columns:var(--sideW,232px) minmax(0,1fr) 0}
body[data-right=off] .right{display:none}
/* Cada panel con su columna fija: ocultar uno nunca corre a los demás */
.side{grid-column:1;grid-row:1}.main{grid-column:2;grid-row:1}.right{grid-column:3;grid-row:1}
.body{transition:none}
.side,.right,.panel+.panel{border-color:var(--line)}
.side-h .lbl{font-weight:600;letter-spacing:.02em;text-transform:none;font-size:12px}
.tile{background:none!important;box-shadow:none;color:var(--muted)}
.tab.active .tile{background:var(--hover)!important;color:var(--text)}
.tile .dot{width:7px;height:7px;border:0;right:2px;bottom:2px}
.tile .dot.idle{display:none}
.tile .badge{top:-3px;right:-4px;font-size:9px;line-height:14px;padding:0 4px}
.tab.active{box-shadow:inset 2px 0 0 var(--accent);border-color:transparent}
.tab .x{color:var(--faint)}
body[data-side=icons] .tile{opacity:1;width:36px;height:36px;border-radius:10px}
body[data-side=icons] .tab.active .tile{box-shadow:none}
body[data-side=icons] .side-h{order:2;padding:6px 0 10px}
body[data-side=icons] #new-tab-menu{display:none}
body[data-side=icons] .menu{top:auto;bottom:34px}
body[data-side=icons] #new-tab{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:18px}
body[data-side=icons] #new-tab:hover{background:var(--hover);color:var(--text)}
.blocks{padding:6px 24px 14px;gap:0;line-height:1.6}
.block{border:0;border-radius:0;background:none;border-top:1px solid var(--line);padding:12px 0;overflow:visible}
.blocks>.block:first-child{border-top:0}
.block.err{box-shadow:none}
.block .cmd{display:flex;align-items:baseline;gap:9px;padding:0;font-weight:500}
.block .cmd .cx{white-space:pre-wrap;min-width:0}
.pm{color:var(--accent);user-select:none}
.block.err .pm{color:var(--err)}
.meta{margin-left:auto;display:flex;gap:4px;align-items:center;font-family:var(--ui);font-size:11px;color:var(--faint);font-weight:400;white-space:nowrap}
.block .out{padding:5px 0 0 19px;opacity:.82}
.block-h{border:0;background:none;padding:0 0 6px;font-size:11.5px}
.block[data-ab] .out{margin-left:7px;padding:2px 0 2px 14px;border-left:2px solid var(--line);opacity:1}
.chip{background:none;border:0;padding:0;color:var(--muted)}

.state{background:none!important;padding:0;font-weight:600;font-size:11px}
.diff,.log{border:0;background:color-mix(in srgb,var(--text) 3.5%,transparent);border-radius:6px}

.sug button:hover{color:var(--text);background:var(--hover)}

.ag-ask{background:none;border:0;border-left:2px solid var(--warn);border-radius:0;padding:4px 0 4px 10px}
.ag-done button,.ag-ask button:not(.yes){background:none}
.input-wrap{margin:0 20px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:9px 12px}
.input-wrap:focus-within{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:none}
.hint{display:none}
.hint:has(.paste){display:flex}
.editor::before{content:'❯';position:absolute;left:0;top:0;line-height:24px;color:var(--accent)}
.editor .hl,.editor textarea{left:20px}
.ptabs{padding:0 8px 0 12px;height:40px;align-items:stretch;border-bottom:1px solid var(--line)}
.ptabs>button{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;padding:0 6px}
.ptabs>button.on{font-weight:600}
.ptabs .r{align-items:center;padding:0}
.ptabs .cnt{background:none;color:var(--muted);padding:0}
.wdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
#ag-scope,#sim8{opacity:0;transition:opacity .15s}
.ptabs:hover #ag-scope,.ptabs:hover #sim8{opacity:1}
.ptabs .btn.sm{border:0;background:none;color:var(--muted)}
.ptabs .btn.sm:hover{background:var(--hover);color:var(--text)}
.seg{border:0}
.counters{display:none}
.alist{padding-top:6px}
.ar.sel{background:var(--hover)}
.ar.waiting{background:none}
.ar.waiting .aa{color:var(--warn)}
.ag-detail{background:none;border-top:1px solid var(--line)}
.ag-detail .mini{background:none;border:0;padding:2px 7px;color:var(--muted);font-weight:500}
.ag-detail .mini:hover{background:var(--hover);color:var(--text)}
.ag-detail .btns{gap:2px;margin-left:-7px}
.ucompact{gap:8px}
.fpane .fbtn{opacity:0;transition:opacity .15s}
.fpane:hover .fbtn,.fbtn.on{opacity:1}
.fbar .os{font-weight:600;color:var(--muted)}
#pv-files>.fhint{display:none}
.fpane+.fpane,.xfers{border-color:var(--line)}
.usage-panel .panel-h{display:none}
.usage-panel .panel-b{padding:0}
.ucompact{display:flex;align-items:center;gap:9px;padding:11px 14px;font-size:11.5px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden}
.ucompact:hover,.um:hover{background:var(--hover)}
.ucompact b{color:var(--text);font-weight:600}
.ucompact .mono{font-family:var(--mono);font-size:11px}
.ucompact .r{margin-left:auto;color:var(--faint)}
.um{padding:11px 14px 12px;cursor:pointer}
.dock{border-top:1px solid var(--line)}
.dock-h{background:none;border-bottom:1px solid var(--line)}
.toast{border-left-width:2px;font-size:12px;padding:8px 12px;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.3)}

    else if (s) out += `<span class="str">${esc(t)}</span>`;

/* ════════════ ejecución simulada (local y SSH) ════════════ */

      if (/upgrade/.test(text)) o += (o ? '\n' : '') + 'Se actualizarán los siguientes paquetes:\n  nginx nginx-common openssl libssl3t64 php8.3-fpm php8.3-cli php8.3-common …\n12 actualizados, 0 nuevos, 0 para eliminar.\n<span class="ok">Procesando disparadores para man-db…  Hecho</span>';
      return {ok:true, out:o};
    }
    if (/systemctl (restart|reload)/.test(text)) return {ok:true, out:''};
    if (/systemctl status/.test(text)) return {ok:true, out:`<span class="ok">●</span> ${esc(parts[parts.length-1])}.service\n     Active: <span class="ok">active (running)</span> since ${new Date().toLocaleString('es-PE')}`};
    if (c === 'df') return {ok:true, out:'S.ficheros  Tamaño Usados Disp Uso% Montado en\n/dev/sda1      79G    41G  35G  55% /'};
    if (c === 'tail' || c === 'cat') return {ok:true, out:`<span class="errc">${esc(TEMPLATES.ssh.log)}</span>`};
    if (c === 'git') return {ok:true, out:'Ya está actualizado.'};
    if (c === 'help') return {ok:true, out:'Simulado en SSH: pwd, cd, ls, sudo apt update/upgrade, systemctl status/restart, df -h, tail, git pull'};
    return {ok:true, out:`<span class="dim">(simulación remota) ${esc(c)}</span>`};
  }
  if (c === 'cd' || c === 'z') {

    const k = target && canon(target);
    if (k) { visit(k); return {ok:true, out: c === 'z' ? `<span class="dim">→ ${esc(k)}</span>` : '', cwd:k}; }
    return {ok:false, out:`<span class="errc">No se encuentra la ruta: ${esc(arg)}</span>`};
  }
  if (c === 'pwd') return {ok:true, out:esc(cwd)};
  if (c === 'ls' || c === 'dir') { const k = canon(arg ? resolve(cwd, arg) : cwd); return {ok:true, out:(FS[k] || []).map(n => isFile(n) ? esc(n) : `<span class="acc">${esc(n)}\\</span>`).join('   ') || '<span class="dim">(vacío)</span>'}; }
  if (c === 'git') return {ok:true, out: parts[1] === 'status' ? `En la rama <span class="acc">main</span>\nnada para confirmar, el árbol de trabajo está limpio` : `<span class="typ">a1f3c2e</span> feat: panel de uso\n<span class="typ">9b0d7e1</span> feat: pestañas verticales\n<span class="typ">51c88aa</span> chore: workspace inicial`};
  if (c === 'cargo') return {ok:true, out:`   <span class="ok">Compiling</span> kuntur-term v0.1.0\n   <span class="ok">Compiling</span> kuntur-app v0.1.0\n    <span class="ok">Finished</span> \`release\` profile [optimized] target(s)`};
  if (c === 'npm') return {ok:true, out:/preview/.test(text) ? `<span class="dim">astro preview</span>\n  ┃ Local    <span class="acc">http://localhost:4321/</span>` : `<span class="dim">astro build</span>\n<span class="ok">✓</span> 46 páginas generadas en 3.8s`};
  if (c === 'winget') return {ok:true, out:'No se encontraron actualizaciones disponibles.'};
  if (c === 'help') return {ok:true, out:'Simulado: cd, z, ls/dir, pwd, claude, codex, git, cargo, npm, winget, clear\nAtajos: Alt+T/W pestañas · Alt+B vista de pestañas · Ctrl+` terminal acoplada · Ctrl+K panel'};
  if (!KNOWN.has(c)) return {ok:false, out:`<span class="errc">${esc(parts[0])}: el término no se reconoce como nombre de un cmdlet</span>`};
  return {ok:true, out:'<span class="dim">(simulación)</span>'};
}
function run(raw, t = tab()){

  if (c === 'clear' || c === 'cls') { t.blocks = []; render(); return; }

  if (c === 'claude' || c === 'codex') {

/* ════════════ autocompletado (línea actual) ════════════ */
function suggest(text){
  const t = tab(); if (!text.trim() || text.includes('\n')) return [];
  const parts = text.split(' '), last = parts[parts.length-1], cmd = parts[0].toLowerCase();
  const pre = parts.length > 1 ? parts.slice(0, -1).join(' ') + ' ' : '';
  const out = [], seen = new Set(), add = s => { const k = s.insert.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(s); } };
  HISTORY.filter(h => h.toLowerCase().startsWith(text.toLowerCase()) && h.length > text.length).slice(0, 3).forEach(h => add({kind:'historial', label:h, insert:h, detail:'usado antes'}));
  if (t.kind === 'ssh') {
    if (parts.length > 1 && /^(cd|ls|cat|tail)$/.test(cmd)) {
      const i = last.lastIndexOf('/'), base = i < 0 ? t.cwd : presolve(t.cwd, last.slice(0, i) || '/'), frag = last.slice(i + 1);
      (REMOTE[base] || []).filter(n => n.startsWith(frag)).forEach(n => { const dir = !!REMOTE[presolve(base, n)]; add({kind: dir ? 'carpeta' : 'archivo', label:n + (dir ? '/' : ''), insert: pre + last.slice(0, i + 1) + n + (dir ? '/' : ''), detail:'remoto'}); });
    } else if (parts.length === 1) BUILTINS.filter(b => b.startsWith(text.toLowerCase()) && b !== text.toLowerCase()).forEach(b => add({kind:'comando', label:b, insert:b + ' ', detail:'comando'}));
    return out.slice(0, 8);
  }
  if (cmd === 'z' && parts.length > 1) {
    const q = parts.slice(1).join(' ').toLowerCase().split(/\s+/).filter(Boolean);
    VISITS.filter(v => q.every(w => v.p.toLowerCase().includes(w))).sort((x, y) => frec(y) - frec(x)).forEach(v => add({kind:'visitada', label:short(v.p), insert:'z ' + v.p, detail:`★ ${v.n} visitas`}));
    return out.slice(0, 8);
  }
  const pathCtx = (parts.length > 1 && ['cd','ls','dir','code','cat','explorer'].includes(cmd)) || /^[a-z]:|\\|^~|^\.{1,2}/i.test(last);
  if (pathCtx) {
    const l = last.replace(/^~/, HOME), i = l.lastIndexOf('\\');
    let base, frag;
    if (/^[a-z]:?$/i.test(l)) { base = null; frag = l; }
    else if (i < 0) { base = t.cwd; frag = l; }
    else { base = /^[a-z]:/i.test(l) ? l.slice(0, i) : resolve(t.cwd, l.slice(0, i)); frag = l.slice(i + 1); }
    const typed = last.slice(0, last.length - frag.length);
    if (base === null) ['C:','E:'].filter(d => d.toLowerCase().startsWith(frag.toLowerCase())).forEach(d => add({kind:'unidad', label:d + '\\', insert:pre + d + '\\', detail:'unidad'}));
    else { const k = canon(base) || fsKey(base); (FS[k] || []).filter(n => n.toLowerCase().startsWith(frag.toLowerCase())).sort((x, y) => isFile(x) - isFile(y)).forEach(n => add({kind: isFile(n) ? 'archivo' : 'carpeta', label: n + (isFile(n) ? '' : '\\'), insert: pre + typed + n + (isFile(n) ? '' : '\\'), detail: isFile(n) ? 'archivo' : 'carpeta'})); }
    if (frag.length >= 2) VISITS.filter(v => v.p.toLowerCase().includes(frag.toLowerCase())).sort((x, y) => frec(y) - frec(x)).slice(0, 4).forEach(v => add({kind:'visitada', label:short(v.p), insert:pre + v.p + '\\', detail:`★ ${v.n} visitas`}));
  } else if (parts.length === 1) BUILTINS.filter(b => b.startsWith(text.toLowerCase()) && b !== text.toLowerCase()).forEach(b => add({kind:'comando', label:b, insert:b + ' ', detail:'comando'}));
  return out.slice(0, 8);
}

}

/* ════════════ portapapeles ════════════ */
async function copyText(txt, label = 'Copiado'){
  if (!txt) return;
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
  toast(`⧉ ${label} · ${txt.length} caracteres${txt.includes('\n') ? ` · ${txt.split('\n').length} líneas` : ''}`, null, null, 'info');
}
async function readClip(){ try { return await navigator.clipboard.readText(); } catch (e) { toast('El navegador no dejó leer el portapapeles: usa Ctrl+V dentro del campo.', null, null, 'info'); return null; } }
function plain(el){
  if (!el) return '';
  const c = el.cloneNode(true);
  c.querySelectorAll('.nocopy,.ln,button').forEach(x => x.remove());
  c.querySelectorAll('div').forEach(d => d.append('\n'));
  return c.textContent.replace(/\n{3,}/g, '\n\n').trim();
}
function pasteInto(target, txt){
  if (txt == null) return;
  if (target === 'dock') { openDock(tab(), {cmd: $('#dock-cmd').value + txt.replace(/\r?\n$/, '')}); return; }
  const ta = $('#cmd'); ta.focus(); ta.setRangeText(txt.replace(/\r\n/g, '\n'), ta.selectionStart, ta.selectionEnd, 'end');
  notePaste(txt); refreshSuggest();
}
function notePaste(txt){ const n = txt.replace(/\r?\n$/, '').split(/\r?\n/).length; S.pasteNote = n > 1 ? `Pegaste ${n} líneas (modo pegado entre corchetes: no se ejecuta nada hasta que presiones Enter)` : ''; renderHint(); }
let ctxSel = '', ctxBlock = null;
function openCtx(e){
  ctxSel = selText(); ctxBlock = e.target.closest('.block');
  const inDock = !!e.target.closest('#dock-out');
  const items = [
    ['Copiar selección', 'Ctrl+Shift+C', !ctxSel, () => copyText(ctxSel)],
    ['Copiar bloque completo', '', !ctxBlock && !inDock, () => copyText(inDock ? plain($('#dock-out')) : plain(ctxBlock))],
    ['Enviar selección a la terminal acoplada', '', !ctxSel, () => openDock(tab(), {cmd: ctxSel.trim()})],
    '-',
    ['Pegar en la entrada de la sesión', 'Ctrl+Shift+V', false, async () => pasteInto('main', await readClip())],
    ['Pegar en la terminal acoplada', '', false, async () => pasteInto('dock', await readClip())],
    '-',
    ['Abrir terminal acoplada aquí', 'Ctrl+`', false, () => openDock(tab())],
  ];
  showCtx(e, items);
}
function showCtx(e, items){
  const m = $('#ctx');
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : `<button data-ci="${i}" ${it[2] ? 'disabled' : ''}>${it[0]}<span class="k">${it[1]}</span></button>`).join('');
  m.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { closeCtx(); items[+b.dataset.ci][3](); });
  m.classList.add('open');
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px'; m.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
}
const closeCtx = () => $('#ctx').classList.remove('open');

function closeTab(id){
  const i = S.tabs.findIndex(t => t.id === id); if (i < 0) return;
  const [t] = S.tabs.splice(i, 1); S.closed = {t, i};
  if (!S.tabs.length) newTab();
  if (S.active === id) S.active = S.tabs[Math.max(0, i - 1)].id;
  const n = t.agents.filter(a => a.state !== 'done').length;

}

function toast(html, act, fn, kind = 'warn'){
  const el = document.createElement('div'); el.className = 'toast ' + kind;

/* ════════════ simulación en vivo ════════════ */
function tick(){
  const t = tab();
  for (const tb of S.tabs) for (const a of tb.agents) {
    const prev = a.state;
    if (a.state === 'working') {
      const out = rnd(25, 95) + a.subs.filter(s => s.state === 'working').length * rnd(10, 30);
      const inp = Math.random() < .3 ? rnd(800, 4000) : 0, cache = inp ? rnd(2000, 12000) : 0;
      a.tokOut += out; a.tokIn += inp; a.cacheR += cache;
      const c = out * a.price.out + inp * a.price.in + cache * a.price.cache;
      a.cost += c; S.today.cost += c; S.today.tok += out + inp + cache;
      a.tps = out; a.ctx = Math.min(96, a.ctx + (inp + cache) / a.ctxSize * 12); a.elapsed++;
      if (Math.random() < .1) a.verb = pick(VERBS);
      if (Math.random() < .22) a.action = pick(a.tpl.acts);
      const L = a.kind === 'claude' ? [S.limits.c5, S.limits.c7] : [S.limits.x5, S.limits.x7];
      L[0].pct = Math.min(100, L[0].pct + out / 9000); L[1].pct = Math.min(100, L[1].pct + out / 60000);
      const r = Math.random(), busySubs = a.subs.some(s => s.state !== 'done');
      if (r < .025) a.state = 'waiting'; else if (r < .04 && !busySubs) a.state = 'done';
    } else a.tps = Math.max(0, a.tps * .5 - 1);
    for (const s of a.subs) {
      if (s.state === 'working') {
        s.elapsed++;
        if (Math.random() < .25) s.action = pick(SUB_ACTS);
        const r = Math.random();
        if (r < .012) { s.state = 'waiting'; if (tb.id !== S.active) tb.badge++; toast(`⚠ Subagente <b>${esc(s.type)}</b> en «${esc(tb.name)}» espera permiso`, tb.id === S.active ? null : 'Ir', () => switchTab(tb.id)); }
        else if (r < .05) s.state = 'done';
      }
      if (a.state === 'done' && s.state === 'working') s.state = 'done';
    }
    a.hist.push(a.tps); a.hist.shift();
    if (a.state !== prev) {
      if (tb.id === S.active) S.pendingBlocks.add(a.id);
      if (a.state === 'waiting') { if (tb.id !== S.active) tb.badge++; toast(`⚠ <b>${KIND[a.kind].label}</b> en «${esc(tb.name)}» espera permiso: <span class="c-cmd">${esc(a.tpl.ask)}</span>`, tb.id === S.active ? null : 'Ir', () => switchTab(tb.id)); }
    }
  }
  renderTabs(); renderAgents(); renderUsage(); renderStatus();

  const xs = S.xfers.filter(x => x.tabId === S.active).slice(-4);
  if (!xs.length) return '<div class="xfers" style="display:none"></div>';
  return `<div class="xfers">${xs.map(x => { const p = Math.min(100, x.done / x.size * 100); return `<div class="xf ${x.state}"><span class="${x.kind === 'up' ? 'acc' : x.kind === 'down' ? 'ok' : 'dim'}">${x.kind === 'up' ? '↑' : x.kind === 'down' ? '↓' : '⧉'}</span><span class="n" title="${esc(x.dstLabel)}">${esc(x.name)}</span><span class="m">${x.state === 'done' ? '✓ ' + (x.dir ? 'carpeta' : fmtB(x.size)) : p.toFixed(0) + '% · ' + fmtB(x.speed) + '/s'}</span><div class="pb"><i style="width:${p.toFixed(1)}%"></i></div></div>`; }).join('')}</div>`;
}
function renderPtabs(){
  document.querySelectorAll('[data-ptab]').forEach(b => b.classList.toggle('on', b.dataset.ptab === S.ptab));
  $('#pv-agents').classList.toggle('on', S.ptab === 'agents'); $('#pv-files').classList.toggle('on', S.ptab === 'files');
  $('#ag-tools').style.display = S.ptab === 'agents' ? '' : 'none';
}
function renderFiles(){
  renderPtabs();
  if (S.ptab !== 'files') return;
  const t = tab(), f = fstate(t), el = $('#pv-files');
  const act = document.activeElement, focusSide = act && act.classList && act.classList.contains('flist') ? act.dataset.side : null;
  const st = {}; el.querySelectorAll('.flist').forEach(x => st[x.dataset.side] = x.scrollTop);
  el.innerHTML = (t.kind === 'ssh' ? ['r', 'l'] : ['l']).map(s => paneHTML(t, f, s)).join('')
    + `<div class="fhint">${t.kind === 'ssh' ? 'Arrastra entre servidor ↔ este equipo para copiar · desde el Explorador de Windows para subir · a la terminal para insertar la ruta' : 'Arrastra desde el Explorador de Windows para copiar aquí · arrastra una fila a la terminal para insertar su ruta'}</div>`
    + xfersHTML();
  el.querySelectorAll('.flist').forEach(x => { x.scrollTop = st[x.dataset.side] || 0; if (x.dataset.side === focusSide) x.focus({preventScroll:true}); });
}
function nav(t, s, p){ const f = fstate(t); if (s === dockSide(t)) f.follow = false; f[s] = p; f.sel[s].clear(); renderFiles(); }
function startXfer(t, o){
  const name = uniqueName(o.dst.side, o.dst.path, o.name), size = Math.max(1, o.dir ? 3e6 : (o.size || 4096));
  const speed = Math.max(o.kind === 'copy' ? 150e6 : rnd(9e6, 26e6), size / 6);
  S.xfers.push({id:uuid(), tabId:t.id, kind:o.kind, name, size, dir:!!o.dir, dst:o.dst, done:0, speed, state:'run',
    dstLabel: (o.dst.side === 'r' ? t.host + ':' : '') + SIDES[o.dst.side].join(o.dst.path, name)});
  if (S.xfers.length > 16) S.xfers.shift();
  if (S.ptab === 'files') { const b = document.querySelector('#pv-files .xfers'); if (b) b.outerHTML = xfersHTML(); }
}
function transferNames(t, ss, sp, names, ds, dp){
  if (ss === ds && sp === dp) { toast('Ya está en esta carpeta.', null, null, 'info'); return; }
  names.forEach(n => { const m = fMeta(ss, sp, n); startXfer(t, {kind: ss === ds ? 'copy' : ds === 'r' ? 'up' : 'down', name:n, size:m.size, dir:m.dir, dst:{side:ds, path:dp}}); });
  toast(`${ss === ds ? '⧉ Copiando' : ds === 'r' ? '↑ Subiendo al servidor' : '↓ Descargando a este equipo'} · ${names.length} elemento(s) → <span style="font-family:var(--mono)">${esc(ds === 'r' ? t.host + ':' + dp : short(dp))}</span>`, null, null, 'info');
}
function dropInto(t, side, dt, path){
  const f = fstate(t); path = path || f[side];
  const raw = dt.getData ? dt.getData('application/x-nodo') : '';
  if (raw) { const d = JSON.parse(raw); transferNames(t, d.s, d.path, d.names, side, path); return; }
  const files = [...(dt.files || [])];
  if (!files.length) return;
  files.forEach(fl => startXfer(t, {kind: side === 'r' ? 'up' : 'copy', name: fl.name, size: fl.size || 4096, dst:{side, path}}));
  toast(`${side === 'r' ? '↑ Subiendo' : '⧉ Copiando'} ${files.length} archivo(s) de Windows → <span style="font-family:var(--mono)">${esc(side === 'r' ? t.host + ':' + path : short(path))}</span>`, null, null, 'info');
}
function openItem(t, s, n){
  const f = fstate(t), P = f[s];
  if (fIsDir(s, P, n)) { nav(t, s, SIDES[s].join(P, n)); return; }
  if (s === 'l') toast(`Abriendo <b>${esc(n)}</b> con la aplicación predeterminada de Windows (simulado)`, null, null, 'info');
  else { startXfer(t, {kind:'down', name:n, size:fMeta(s, P, n).size, dst:{side:'l', path:W('C:/Users/dev/AppData/Local/Temp')}}); toast(`↓ <b>${esc(n)}</b> se descarga a una carpeta temporal y se abre; si lo editas, Kuntur ofrece volver a subirlo.`, null, null, 'info'); }
}
function delAsk(t, s){
  const f = fstate(t), names = [...f.sel[s]]; if (!names.length) return;
  toast(`¿Eliminar ${names.length} elemento(s) de ${s === 'r' ? esc(t.host) + ' <b>(no se puede deshacer)</b>' : 'este equipo (van a la Papelera)'}?`, 'Eliminar', () => {
    const L = SIDES[s].list(f[s]); names.forEach(n => { const i = L.indexOf(n); if (i >= 0) L.splice(i, 1); }); f.sel[s].clear(); renderFiles();
  });
}
function copyFiles(t, s){
  const f = fstate(t), names = [...f.sel[s]]; if (!names.length) return;
  S.fclip = {s, path:f[s], names};
  toast(`⧉ ${names.length} elemento(s) copiado(s) · Ctrl+V en otra carpeta${t.kind === 'ssh' ? ' o en la otra lista' : ''} (en la app real también en el Explorador de Windows)`, null, null, 'info');
}
function fileAct(t, s, act){
  const f = fstate(t);
  if (act === 'up') nav(t, s, SIDES[s].up(f[s]));
  if (act === 'mk') { const n = uniqueName(s, f[s], 'nueva carpeta'), full = SIDES[s].join(f[s], n); SIDES[s].add(f[s], n, true); META[full] = {dir:true, size:null, m:Date.now()}; f.fresh.add(full); setTimeout(() => f.fresh.delete(full), 1500); renderFiles(); }
  if (act === 'pick') { S.pickTarget = {t, s}; $('#fpick').click(); }
  if (act === 'follow') { f.follow = !f.follow; renderFiles(); }
  if (act === 'term') { t.dock.target = 'session'; openDock(t, {cwd: f[s]}); }
}
function fileCtx(e){
  const t = tab(), f = fstate(t), r = e.target.closest('.fr'), s = e.target.closest('.flist').dataset.side, P = f[s], other = s === 'r' ? 'l' : 'r';
  if (r && !f.sel[s].has(r.dataset.fname)) { f.sel[s].clear(); f.sel[s].add(r.dataset.fname); renderFiles(); }
  const names = [...f.sel[s]], one = r ? r.dataset.fname : null, full = one ? SIDES[s].join(P, one) : P, canDock = s === dockSide(t);
  const paste = ['Pegar aquí', 'Ctrl+V', !S.fclip, () => transferNames(t, S.fclip.s, S.fclip.path, S.fclip.names, s, P)];
  const items = r ? [
    ['Abrir', 'Enter', false, () => openItem(t, s, one)],
    ...(t.kind === 'ssh' ? [[s === 'r' ? '↓ Descargar a este equipo' : '↑ Subir al servidor', '', false, () => transferNames(t, s, P, names, other, f[other])]] : []),
    ['Copiar', 'Ctrl+C', false, () => copyFiles(t, s)], paste, '-',
    ['Copiar ruta', '', false, () => copyText(full, 'Ruta copiada')],
    ['Insertar ruta en la terminal', '', false, () => pasteInto('main', qp(full))],
    ['Abrir terminal acoplada aquí', '', !canDock, () => openDock(t, {cwd: fIsDir(s, P, one) ? full : P})], '-',
    ['Eliminar…', 'Supr', false, () => delAsk(t, s)],
  ] : [
    paste, ['Nueva carpeta', '', false, () => fileAct(t, s, 'mk')], ['Subir / copiar archivos aquí…', '', false, () => fileAct(t, s, 'pick')], '-',
    ['Copiar ruta', '', false, () => copyText(P, 'Ruta copiada')], ['Abrir terminal acoplada aquí', '', !canDock, () => openDock(t, {cwd: P})],
  ];
  showCtx(e, items);
}
setInterval(() => {
  let fin = false;
  for (const x of S.xfers) if (x.state === 'run') {
    x.done = Math.min(x.size, x.done + x.speed * .2 * rnd(.7, 1.2));
    if (x.done >= x.size) {
      x.state = 'done'; fin = true;
      const SD = SIDES[x.dst.side], full = SD.join(x.dst.path, x.name);
      SD.add(x.dst.path, x.name, x.dir); META[full] = {dir:x.dir, size:x.dir ? null : x.size, m:Date.now()};
      const tb = S.tabs.find(q => q.id === x.tabId); if (tb && tb.files) { tb.files.fresh.add(full); setTimeout(() => tb.files.fresh.delete(full), 1500); }
    }
  }
  if (S.ptab === 'files') { if (fin) renderFiles(); else { const b = document.querySelector('#pv-files .xfers'); if (b && S.xfers.some(x => x.state === 'run')) b.outerHTML = xfersHTML(); } }
}, 200);

const pv = $('#pv-files');
pv.addEventListener('click', e => {
  const t = tab(), f = fstate(t);
  const b = e.target.closest('[data-fact]'); if (b) { fileAct(t, b.dataset.s, b.dataset.fact); return; }
  const c = e.target.closest('[data-fcrumb]'); if (c) { const s = c.dataset.s; nav(t, s, SIDES[s].fromSegs(SIDES[s].segs(f[s]).slice(0, +c.dataset.fcrumb + 1))); return; }
  const r = e.target.closest('.fr');
  if (r) { const s = r.dataset.fside, n = r.dataset.fname; if (!e.ctrlKey) { f.sel.l.clear(); f.sel.r.clear(); } if (e.ctrlKey && f.sel[s].has(n)) f.sel[s].delete(n); else f.sel[s].add(n); }
  else if (e.target.closest('.flist')) { f.sel.l.clear(); f.sel.r.clear(); }
  else return;
  renderFiles();
});
pv.addEventListener('dblclick', e => { const r = e.target.closest('.fr'); if (r) openItem(tab(), r.dataset.fside, r.dataset.fname); });
pv.addEventListener('dragstart', e => {
  const r = e.target.closest('.fr'); if (!r) return;
  const t = tab(), f = fstate(t), s = r.dataset.fside, n = r.dataset.fname;
  const names = f.sel[s].has(n) ? [...f.sel[s]] : [n];
  e.dataTransfer.setData('application/x-nodo', JSON.stringify({s, path:f[s], names}));
  e.dataTransfer.setData('text/plain', names.map(x => qp(SIDES[s].join(f[s], x))).join(' '));
  e.dataTransfer.effectAllowed = 'copy';
});
pv.addEventListener('dragover', e => { const l = e.target.closest('.flist'); if (!l) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; pv.querySelectorAll('.flist').forEach(x => x.classList.toggle('drop', x === l)); });
pv.addEventListener('dragleave', e => { if (!e.relatedTarget || !pv.contains(e.relatedTarget)) pv.querySelectorAll('.flist').forEach(x => x.classList.remove('drop')); });
pv.addEventListener('drop', e => { const l = e.target.closest('.flist'); pv.querySelectorAll('.flist').forEach(x => x.classList.remove('drop')); if (!l) return; e.preventDefault(); dropInto(tab(), l.dataset.side, e.dataTransfer); });
pv.addEventListener('keydown', e => {
  const l = e.target.closest('.flist'); if (!l) return;
  const t = tab(), f = fstate(t), s = l.dataset.side, k = e.key.toLowerCase();
  if (e.ctrlKey && k === 'c') { e.preventDefault(); copyFiles(t, s); }
  if (e.ctrlKey && k === 'v') { // primero se intenta el portapapeles de Windows (archivos copiados en el Explorador)
    S.pendingPaste = {t, s};
    setTimeout(() => { const pp = S.pendingPaste; if (!pp) return; S.pendingPaste = null; if (S.fclip) transferNames(pp.t, S.fclip.s, S.fclip.path, S.fclip.names, pp.s, fstate(pp.t)[pp.s]); else toast('No hay archivos copiados.', null, null, 'info'); }, 80);
  }
  if (e.ctrlKey && k === 'a') { e.preventDefault(); SIDES[s].list(f[s]).forEach(n => f.sel[s].add(n)); renderFiles(); }
  if (e.key === 'Delete') delAsk(t, s);
  if (e.key === 'Enter') { const n = [...f.sel[s]][0]; if (n) openItem(t, s, n); }
  if (e.key === 'Backspace') { e.preventDefault(); nav(t, s, SIDES[s].up(f[s])); }
});
pv.addEventListener('paste', e => {
  const files = [...((e.clipboardData && e.clipboardData.files) || [])];
  if (!files.length || !S.pendingPaste) return;
  e.preventDefault(); const pp = S.pendingPaste; S.pendingPaste = null; dropInto(pp.t, pp.s, {files});
});
$('#fpick').addEventListener('change', e => { const p = S.pickTarget; if (p && e.target.files.length) dropInto(p.t, p.s, {files: e.target.files}); e.target.value = ''; });
document.querySelectorAll('[data-ptab]').forEach(b => b.addEventListener('click', () => { S.ptab = b.dataset.ptab; renderFiles(); }));

// Soltar sobre la sesión: por SSH se sube a la carpeta actual; en local se inserta la ruta.
const sess = $('.session'); let dragDepth = 0;
sess.addEventListener('dragenter', e => {
  dragDepth++; const t = tab(), osFiles = [...e.dataTransfer.types].includes('Files');
  sess.classList.add('drop');
  $('#dropmsg').innerHTML = osFiles && t.kind === 'ssh' ? `↑ Suelta para subir a<br><span style="font-family:var(--mono)">${esc(t.host)}:${esc(t.cwd)}</span>` : '⌨ Suelta para insertar la ruta en la entrada';
});
sess.addEventListener('dragover', e => e.preventDefault());
sess.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; sess.classList.remove('drop'); } });
sess.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; sess.classList.remove('drop');
  const t = tab(), dt = e.dataTransfer, raw = dt.getData('application/x-nodo');
  if (raw) { const d = JSON.parse(raw); pasteInto('main', d.names.map(n => qp(SIDES[d.s].join(d.path, n))).join(' ')); return; }
  const files = [...dt.files];
  if (!files.length) { const txt = dt.getData('text/plain'); if (txt) pasteInto('main', txt); return; }
  if (t.kind === 'ssh') {
    files.forEach(fl => startXfer(t, {kind:'up', name:fl.name, size:fl.size || 4096, dst:{side:'r', path:t.cwd}}));
    t.blocks.push({type:'info', html:`<span class="acc">↑</span> <span class="dim">Subiendo ${files.length} archivo(s) a ${esc(t.host)}:${esc(t.cwd)} por SFTP (misma conexión, sin volver a autenticar)</span>`});
    S.ptab = 'files'; renderBlocks(true); renderFiles();
  } else { pasteInto('main', files.map(fl => qp(HOME + '\\Downloads\\' + fl.name)).join(' ')); toast('En la app real se inserta la ruta completa del archivo soltado.', null, null, 'info'); }
});
const dockEl = $('#dock');
dockEl.addEventListener('dragover', e => e.preventDefault());
dockEl.addEventListener('drop', e => {
  e.preventDefault(); const t = tab(), dt = e.dataTransfer, raw = dt.getData('application/x-nodo');
  if (raw) { const d = JSON.parse(raw); openDock(t, {cmd: ($('#dock-cmd').value + ' ' + d.names.map(n => qp(SIDES[d.s].join(d.path, n))).join(' ')).trim()}); return; }
  const files = [...dt.files];
  if (files.length && t.kind === 'ssh') { files.forEach(fl => startXfer(t, {kind:'up', name:fl.name, size:fl.size || 4096, dst:{side:'r', path:t.dock.cwd}})); t.dock.lines.push(`<span class="acc">↑</span> <span class="dim">Subiendo ${files.length} archivo(s) a ${esc(t.dock.cwd)}</span>\n`); renderDock(); }
});

/* ════════════ tarjeta al pasar el mouse (vista de íconos) ════════════ */
let hcT = null;
function showCard(el){
  const t = S.tabs.find(x => x.id === +el.dataset.tab); if (!t) return;
  const rows = t.agents.flatMap(a => [a, ...a.subs]), c = s => rows.filter(r => r.state === s).length;
  const card = $('#hcard');
  card.innerHTML = `<div class="h"><span class="tile" style="width:22px;height:22px;border-radius:7px;background:${ICON_BG[t.icon]}">${icon(t.icon)}</span>${esc(t.name)}<span class="k kbd">Alt+${el.dataset.idx}</span></div>
    <div class="s">${esc(t.summary)}</div>
    <div class="p">${t.kind === 'ssh' ? esc(t.host) + ':' : ''}${esc(short(t.cwd))}${t.branch ? ` · ⎇ ${esc(t.branch)}` : ''}</div>
    ${rows.length ? `<div class="a"><span class="acc">● ${c('working')} trabajando</span><span class="warn">⚠ ${c('waiting')} esperando</span><span class="ok">✓ ${c('done')}</span></div>` : '<div class="a dim">sin agentes · shell ' + esc(t.shell) + '</div>'}`;
  card.querySelector('.tile svg').style.cssText = 'width:13px;height:13px';
  card.classList.add('open');
  const r = el.getBoundingClientRect(), h = card.offsetHeight;
  card.style.left = (r.right + 12) + 'px';
  card.style.top = Math.max(8, Math.min(innerHeight - h - 8, r.top + r.height / 2 - h / 2)) + 'px';
}
const hideCard = () => { clearTimeout(hcT); $('#hcard').classList.remove('open'); };
$('#tabs').addEventListener('mouseover', e => { const el = e.target.closest('.tab'); if (!el || S.side !== 'icons') return; clearTimeout(hcT); hcT = setTimeout(() => showCard(el), 110); });
$('#tabs').addEventListener('mouseleave', hideCard);
$('#tabs').addEventListener('click', hideCard);

/* ════════════ inicio ════════════ */
seed();
let th0 = 'blue'; try { th0 = localStorage.getItem('kuntur-theme') || 'blue'; S.side = localStorage.getItem('kuntur-side') || 'icons'; } catch (e) {}
if (S.side !== 'full') S.side = 'icons';
document.body.dataset.right = 'on';
$('#right-toggle').onclick = () => { S.right = !S.right; document.body.dataset.right = S.right ? 'on' : 'off'; renderMainHead(); setTimeout(renderUsage, 50); };
$('#tb-title').onclick = () => openSheet('mcp');
$('#usage').addEventListener('click', () => { S.usageOpen = !S.usageOpen; renderUsage(); });
$('#new-tab').addEventListener('contextmenu', e => { e.preventDefault(); $('#shell-menu').classList.toggle('open'); });
$('#new-tab').title = 'Nueva sesión (Alt+T) · clic derecho: elegir shell o SSH';
addEventListener('keydown', e => { if (e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'j') { e.preventDefault(); $('#right-toggle').click(); } });
document.body.dataset.side = S.side;
setTheme(THEMES[th0] ? th0 : 'blue');
render(true);
setInterval(tick, 1000);
ta.focus();
</script>
