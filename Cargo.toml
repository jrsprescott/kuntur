[workspace]
resolver = "3"
members = ["crates/*"]
# spikes/ quedan fuera: cada prueba técnica compila aparte.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# Se irán activando por fase (ver docs/PLAN.md §5).
# gpui-kit = "0.11"            # F1/F2 (kuntur-app)
# alacritty_terminal = "0.26"  # F1 (kuntur-term)
# portable-pty = "0.9"         # F1 (kuntur-term)
# sysinfo = "0.40"             # F4 (kuntur-agents)
# notify = "9"                 # F5 (kuntur-usage)
# nucleo = "0.5"               # F3 (kuntur-complete)
# rusqlite = { version = "0.43", features = ["bundled"] }  # F3
# toml = "1.2"                 # F2 (kuntur-config)
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
