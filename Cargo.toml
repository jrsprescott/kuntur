[workspace]
resolver = "3"
members = ["crates/*"]
# spikes/ quedan fuera: cada prueba técnica compila aparte.

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"
authors = ["jrsprescott"]
repository = "https://github.com/jrsprescott/kuntur"
description = "Lightweight Windows terminal for AI coding agents"

[workspace.dependencies]
# F1
gpui-kit = "0.11"
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
smol = "2"
# F2 (kuntur-config)
toml = "1.2"
serde = { version = "1", features = ["derive"] }
# F3 (kuntur-usage, kuntur-agents)
serde_json = "1"
zstd = "0.14"
rusqlite = { version = "0.43", features = ["bundled"] }
jiff = "1"
sysinfo = "0.40"
# F8 (kuntur-preview: recarga automática y diff)
notify = "9"
similar = "2"
wry = "0.57"
# Se irán activando por fase (ver docs/plans/README.md).
# F9 (kuntur-complete): solo el buscador difuso de nucleo, sin su motor con hilos.
nucleo-matcher = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
